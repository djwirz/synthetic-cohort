# Synthea v4.0.0 settings for the pinned cohort (ADR 0003, ADR 0007).
# Only settings that differ from Synthea's defaults are listed. Changing anything here changes the
# cohort, the case set and every score computed from them: regenerate, re-check, and say so in the PR.

# FHIR R4 transaction bundles only.
exporter.fhir.export = true
exporter.fhir.transaction_bundle = true
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.ccda.export = false
exporter.csv.export = false
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true
# Run metadata carries the wall-clock time; leave it out so reruns are byte-identical.
exporter.metadata.export = false
# Patient files named by their (seeded) UUID, not by name plus timestamp.
exporter.use_uuid_filenames = true

# Size: keep five years of history, and drop resource types the tools never read that dominate
# bundle size (billing, provenance, imaging, documents with embedded notes).
exporter.years_of_history = 5
exporter.fhir.excluded_resources = Claim,ExplanationOfBenefit,Provenance,ImagingStudy,Media,DocumentReference,SupplyDelivery
exporter.clinical_note.export = false

# Living patients only: questions are about current care.
generate.only_alive_patients = true

# One generator thread. With Synthea's default (one per CPU core) patients that touch shared
# state come out differently from run to run, and from machine to machine; we saw one bundle
# change between otherwise identical runs.
generate.thread_pool_size = 1
